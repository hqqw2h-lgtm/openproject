name: Publish unlocked image

on:
  workflow_dispatch:
  push:
    tags:
      - "v*-unlocked"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/openproject
          tags: |
            type=raw,value=17-slim-unlocked,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build and push unlocked image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/prod/Dockerfile
          target: slim-unlocked
          build-args: |
            BIM_SUPPORT=false
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
